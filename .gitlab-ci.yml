image: node:20-slim

variables:
  NODE_OPTIONS: "--max-old-space-size=1536"

pages:
  stage: deploy
  tags:
    - itup-alm-x86
  before_script:
    - corepack enable
    - |
      cat > app-config.local.yaml << EOF
      app:
        baseUrl: ${CI_PAGES_URL}
      backend:
        baseUrl: ${CI_PAGES_URL}
      signInPage: guest
      auth:
        providers:
          guest:
            dangerouslyAllowOutsideDevelopment: true
      permission:
        enabled: false
      EOF
  script:
    - yarn config set networkConcurrency 2
    - yarn config set enableGlobalCache false
    - yarn install
    - yarn build:all
    - mkdir -p public
    - cp -r packages/app/dist/* public/
    - cp public/index.html public/404.html
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "design/trunk"
